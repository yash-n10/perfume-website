<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MOHERA</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://foo.github.io/bar/admin_panel becomes https://foo.github.io/bar/?/admin_panel
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If deployed at repository root or subpath, detect pathSegmentsToKeep
      // If URL has /<repo>/ then pathSegmentsToKeep = 1, if custom domain/root then 0
      var path = l.pathname;
      var parts = path.split('/').filter(Boolean);
      // If the first segment is repository name e.g. 'perfume-website'
      if (parts.length > 0 && parts[0] === 'perfume-website') {
        pathSegmentsToKeep = 1;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
